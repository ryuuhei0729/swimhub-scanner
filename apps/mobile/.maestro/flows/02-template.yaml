# タイムシートテンプレートのプレビュー
# scanner には履歴画面が無く、スキャン結果画面は実際の Gemini 解析（カメラ/画像 + API）
# が必要でシミュレータでは撮れないため、代わりに紙テンプレートのプレビューを撮る。
# 必要な env: APP_ID, LOCALE, REGION, APP_EMAIL, APP_PASSWORD, OUTPUT_DIR, DEVICE_TAG
appId: ${APP_ID}
---
- runFlow: ../subflows/login.yaml
# テンプレートセクションはホーム下部にあるためスクロールして開く
- scrollUntilVisible:
    element:
      id: "home-template-toggle"
    direction: DOWN
- tapOn:
    id: "home-template-toggle"
- scrollUntilVisible:
    element:
      id: "home-template-image-button"
    direction: DOWN
- tapOn:
    id: "home-template-image-button"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUTPUT_DIR}/${DEVICE_TAG}_02_template
